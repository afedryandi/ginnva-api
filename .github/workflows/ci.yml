name: CI

# Audit framework 2026-09-14, "Proses CI/CD & deployment" -- gate lint +
# test minimal sebelum kode dianggap layak deploy. Jalan di tiap push ke
# development & tiap Pull Request yang menyasar development. TIDAK
# men-deploy apa pun (masih git pull manual di server, lihat RUNBOOK.md
# §3) -- ini murni quality gate, langkah pertama sebelum CD sungguhan.

on:
  push:
    branches: [development, main, master]
  pull_request:
    branches: [development, main, master]

jobs:
  lint:
    name: Lint (Laravel Pint)
    runs-on: ubuntu-latest
    # continue-on-error: TRUE untuk sementara -- Pint belum pernah
    # dijalankan di codebase ini sebelumnya, jadi run PERTAMA kemungkinan
    # menemukan banyak pelanggaran style lama (bukan dari kode baru).
    # Setelah dijalankan `vendor/bin/pint` sekali (mode auto-fix, bukan
    # --test) di server/lokal untuk merapikan format lama, HAPUS baris
    # continue-on-error ini supaya lint benar-benar jadi gate (blocking).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # --test: gagal (exit non-zero) kalau ada file yang belum sesuai
      # style, TIDAK mengubah file apa pun -- aman dijalankan di CI.
      - name: Run Pint (check only)
        run: vendor/bin/pint --test

  test:
    name: Test (PHPUnit)
    runs-on: ubuntu-latest
    # MySQL, BUKAN SQLite -- setidaknya 10 migration pakai `ALTER TABLE
    # ... MODIFY` (sintaks khusus MySQL untuk ubah definisi ENUM) yang
    # TIDAK didukung SQLite sama sekali, migrasi akan gagal total kalau
    # dites di SQLite. Production juga MySQL, jadi ini sekalian
    # mencerminkan environment sungguhan, bukan cuma workaround.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: ginnva_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 --silent; do
            sleep 1
          done

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ginnva_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ginnva_test
          DB_USERNAME: root
          DB_PASSWORD: ""
